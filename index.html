<!doctype html>
<html lang="nl" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sterspelers - Professionele Begeleiding & Actief Buitenspelen op School</title>
    <meta name="description" content="Sterspelers ontzorgt basisscholen, besturen en gemeenten met ervaren begeleiders voor een veilig en georganiseerd pauzeklimaat." />

    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sterspelers.com/" />
    <meta property="og:title" content="Sterspelers - Professionele Begeleiding & Actief Buitenspelen op School" />
    <meta property="og:description" content="Sterspelers ontzorgt basisscholen, besturen en gemeenten met ervaren begeleiders voor een veilig en georganiseerd pauzeklimaat." />
    <meta property="og:image" content="https://sterspelers.com/og-image.jpg" />
    <meta property="og:locale" content="nl_NL" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sterspelers - Professionele Begeleiding & Actief Buitenspelen op School" />
    <meta name="twitter:description" content="Sterspelers ontzorgt basisscholen, besturen en gemeenten met ervaren begeleiders voor een veilig en georganiseerd pauzeklimaat." />
    <meta name="twitter:image" content="https://sterspelers.com/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "Sterspelers",
      "description": "Professionele begeleiding voor een veilig en energiek schoolplein.",
      "url": "https://sterspelers.com/",
      "email": "info@sterspelers.nl",
      "areaServed": "NL",
      "image": "https://sterspelers.com/og-image.jpg"
    }
    </script>
  </head>
  <body class="bg-white text-[#0F172A] font-sans antialiased">
    <div id="root"></div>
    <!-- Static form so Netlify's build bot can detect it. The React form in
         ContactModal.tsx submits to this same "contact" form via fetch. -->
    <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" netlify-honeypot="bot-field" hidden>
      <input type="text" name="role" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="schoolName" />
      <input type="text" name="city" />
      <input type="text" name="pupilsCount" />
      <input type="text" name="servicePreference" />
      <textarea name="notes"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
