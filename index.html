<!doctype html>
<html lang="nl" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sterspelers - Professionele Begeleiding & Actief Buitenspelen op School</title>
    <meta name="description" content="Sterspelers ontzorgt basisscholen, besturen en gemeenten met ervaren sport- en TSO-begeleiders voor een veilig en georganiseerd pauzeklimaat." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-white text-[#0F172A] font-sans antialiased">
    <div id="root"></div>
    <!-- Static form so Netlify's build bot can detect it. The React form in
         ContactModal.tsx submits to this same "contact" form via fetch. -->
    <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" netlify-honeypot="bot-field" hidden>
      <input type="text" name="role" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="schoolName" />
      <input type="text" name="city" />
      <input type="text" name="pupilsCount" />
      <input type="text" name="servicePreference" />
      <textarea name="notes"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
